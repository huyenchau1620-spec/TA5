<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiếng Anh 5 bằng sơ đồ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: left unit rail + main lesson column; each unit is a tabbed workbook (map, words, patterns, 4 skills) */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --sunk:#eef1f5; --ink:#1c2533; --muted:#5d6878; --line:#d9dfe7;
  --brand:#1f4e79; --brand-soft:#e3edf7;
  --listen:#2563c9; --listen-soft:#e4edfb;
  --speak:#d0601c; --speak-soft:#fcebdf;
  --read:#23885a; --read-soft:#e1f3ea;
  --write:#7c45c4; --write-soft:#efe6fa;
  --ok:#1f8a4c; --ok-soft:#dff3e7; --bad:#c23b3b; --bad-soft:#fbe4e4; --warn:#a96a00;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a212b; --sunk:#151b23; --ink:#e7ecf2; --muted:#9ba7b6; --line:#2d3644;
  --brand:#8cb8e6; --brand-soft:#1d2d40;
  --listen:#7fa9f0; --listen-soft:#1c2a42; --speak:#f19a5e; --speak-soft:#3a2617;
  --read:#6dcb9a; --read-soft:#173327; --write:#bb92ef; --write-soft:#2c2140;
  --ok:#6dcb9a; --ok-soft:#173327; --bad:#f08b8b; --bad-soft:#3b1c1c; --warn:#e8b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a212b; --sunk:#151b23; --ink:#e7ecf2; --muted:#9ba7b6; --line:#2d3644;
  --brand:#8cb8e6; --brand-soft:#1d2d40;
  --listen:#7fa9f0; --listen-soft:#1c2a42; --speak:#f19a5e; --speak-soft:#3a2617;
  --read:#6dcb9a; --read-soft:#173327; --write:#bb92ef; --write-soft:#2c2140;
  --ok:#6dcb9a; --ok-soft:#173327; --bad:#f08b8b; --bad-soft:#3b1c1c; --warn:#e8b45a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;color:var(--brand);text-decoration:none;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.top .grow{flex:1}
.ctl{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.ctl select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:4px 6px;color:var(--ink);max-width:180px}
.menu-btn{display:none;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:20px 16px 60px}
nav.rail{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;display:flex;flex-direction:column;gap:2px}
nav.rail .grp{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 8px 4px;font-weight:600}
nav.rail a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.9rem}
nav.rail a b{font-family:var(--f-display);color:var(--brand);min-width:2.2em;font-weight:700}
nav.rail a span{flex:1;min-width:0}
nav.rail a.on{background:var(--brand-soft)}
nav.rail a .tick{color:var(--ok);font-weight:700}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.crumb{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head .vi{color:var(--muted);font-size:1rem;margin-top:2px}
.done-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem}
.done-btn.is{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:500}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[data-k="nghe"].on{background:var(--listen);border-color:var(--listen);color:#fff}
.tab[data-k="noi"].on{background:var(--speak);border-color:var(--speak);color:#fff}
.tab[data-k="doc"].on{background:var(--read);border-color:var(--read);color:#fff}
.tab[data-k="viet"].on{background:var(--write);border-color:var(--write);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[data-k].on{color:#10141a}}
:root[data-theme="dark"] .tab[data-k].on{color:#10141a}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec>.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>.sh .tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.note b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--surface);font-weight:600}
.btn.l{border-color:var(--listen);color:var(--listen)} .btn.s{border-color:var(--speak);color:var(--speak)}
.btn.rec{border-color:var(--bad);color:var(--bad)}
.btn.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.say{border:none;background:var(--listen-soft);color:var(--listen);border-radius:999px;width:28px;height:28px;display:inline-grid;place-items:center;flex:none;padding:0}
.say svg{width:15px;height:15px}
.en{font-weight:600}
/* mind map */
.mm{display:flex;flex-direction:column;align-items:center;gap:0}
.mm-c{background:var(--brand);color:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.15rem;border-radius:999px;padding:8px 22px;text-align:center;max-width:100%}
.mm-stem{width:2px;height:18px;background:var(--line)}
.mm-bs{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;border-top:2px solid var(--line);padding-top:16px;position:relative}
.mm-b{background:var(--sunk);border-radius:var(--r);padding:12px;min-width:0;position:relative}
.mm-b::before{content:"";position:absolute;top:-18px;left:24px;width:2px;height:18px;background:var(--line)}
.mm-b h4{margin:0 0 6px;font-family:var(--f-display);font-size:1rem;display:inline-block;padding:1px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.mm-b ul{margin:0;padding-left:18px;font-size:.88rem}
.mm-b li{margin:2px 0}
.mm-b.k-nghe h4{background:var(--listen-soft);border-color:transparent;color:var(--listen)}
.mm-b.k-noi h4{background:var(--speak-soft);border-color:transparent;color:var(--speak)}
.mm-b.k-doc h4{background:var(--read-soft);border-color:transparent;color:var(--read)}
.mm-b.k-viet h4{background:var(--write-soft);border-color:transparent;color:var(--write)}
.mm-b.k-tu h4,.mm-b.k-mau h4{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
@media (max-width:520px){.mm-bs{border-top:none;padding-top:8px}.mm-b::before{display:none}}
/* vocab */
.vt{width:100%;border-collapse:collapse;font-size:.92rem}
.vt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.vt td.ipa{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto}
/* pattern */
.pat{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;background:var(--brand-soft);border-radius:8px;padding:10px 12px;align-items:center}
.form .lab{font-family:var(--f-display);font-weight:700;color:var(--brand)}
.dlg{display:flex;flex-direction:column;gap:6px}
.dlg .ln{display:flex;gap:8px;align-items:center}
.dlg .who{font-weight:600;color:var(--muted);min-width:4.5em;font-size:.85rem}
.irr{border-collapse:collapse;font-size:.9rem}
.irr td,.irr th{border:1px solid var(--line);padding:4px 10px;text-align:left}
.irr th{background:var(--sunk);font-weight:600}
/* quiz */
.qz{display:flex;flex-direction:column;gap:12px}
.qi{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.qi .qq{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qi .qn{font-family:var(--f-display);font-weight:700;color:var(--muted);min-width:1.6em}
.opts{display:flex;gap:6px;flex-wrap:wrap;padding-left:2em}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.92rem}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.fb{padding-left:2em;font-size:.85rem;color:var(--muted)}
.score{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.score.good{color:var(--ok)} .score.mid{color:var(--warn)} .score.low{color:var(--bad)}
/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.steps span{background:var(--sunk);border-radius:999px;padding:3px 10px}
.steps i{color:var(--muted);font-style:normal}
/* speaking */
.sp{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.sp .tx{font-size:1.05rem;font-weight:600}
.res{font-size:.95rem;line-height:1.9}
.res .w{padding:1px 4px;border-radius:4px;margin-right:2px}
.res .w.ok{background:var(--ok-soft);color:var(--ok)}
.res .w.no{background:var(--bad-soft);color:var(--bad)}
.heard{font-size:.82rem;color:var(--muted)}
.stress{display:flex;flex-wrap:wrap;gap:8px}
.stress .si{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:.98rem}
.stress em{font-style:normal;color:var(--speak);font-weight:800}
.micnote{border-left:3px solid var(--speak);background:var(--speak-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem}
/* reading */
.passage{font-size:1.05rem;line-height:1.85;background:var(--read-soft);border-radius:var(--r);padding:14px 16px;max-width:70ch}
.passage .wd{cursor:pointer;border-radius:3px}
.passage .wd:hover{background:var(--surface)}
.tf{display:flex;gap:6px}
/* writing */
.ro{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ro .line{min-height:40px;border:1px dashed var(--line);border-radius:8px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ro .pool{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--write);color:var(--write);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:.95rem}
.ro .line .chip{background:var(--write-soft)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
input.dict{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.chk{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.chk li{display:flex;gap:8px}
.chk .y{color:var(--ok);font-weight:700} .chk .n{color:var(--bad);font-weight:700}
.sample{background:var(--write-soft);border-radius:8px;padding:12px 14px;max-width:70ch}
/* grammar */
.gt{border-collapse:collapse;font-size:.94rem;width:100%}
.gt th{text-align:left;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:6px 10px;white-space:nowrap;vertical-align:top;width:1%}
.gt td{padding:6px 10px;border-bottom:1px solid var(--line)}
.mist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.mist li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;font-size:.92rem;border-bottom:1px dashed var(--line);padding-bottom:6px}
.mist .no{color:var(--bad);text-decoration:line-through}
.mist .yes{color:var(--ok);font-weight:600}
.mist .why{grid-column:1/-1;color:var(--muted);font-size:.85rem}
@media (max-width:520px){.mist li{grid-template-columns:minmax(0,1fr)}.gt th{white-space:normal}}
details.ccq{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
details.ccq summary{cursor:pointer;font-weight:500}
details.ccq p{margin-top:6px;color:var(--ok);font-weight:600}
.given{font-weight:600}
.given.bad{color:var(--bad)}
/* phonetics */
.sw em,.ss em{font-style:normal;color:var(--speak);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.sw{font-size:1.05rem}
.ss{font-size:1.05rem;line-height:1.8}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rule{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rule h3{color:var(--speak)}
.syls{display:flex;gap:4px;flex-wrap:wrap;padding-left:2em}
.syl{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:1.05rem;min-width:44px}
.syl.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.syl.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.kt{border-collapse:collapse;font-size:.88rem;min-width:720px}
.kt th,.kt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.kt th{background:var(--sunk);font-weight:600}
.kt td:first-child{font-family:var(--f-display);font-weight:700;color:var(--brand);white-space:nowrap}
u.end{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
/* stress marking */
.mk{display:flex;gap:2px;flex-wrap:wrap;padding-left:2em;align-items:center}
.mk .syl{position:relative;padding:6px 12px 6px 18px}
.mk .syl::before{content:"";position:absolute;left:6px;top:4px;font-weight:800;color:var(--speak)}
.mk .syl.mark::before{content:"ˈ"}
.mk .syl.mark{border-color:var(--speak);background:var(--speak-soft)}
.mk .ipa{font-family:var(--f-mono);color:var(--muted);font-size:.85rem;margin-left:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cols>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.cols h4{margin:0 0 4px;font-family:var(--f-display);color:var(--speak)}
.sm{display:flex;flex-wrap:wrap;gap:4px;padding-left:2em}
.sm .w{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:1rem}
.sm .w.on{background:var(--speak-soft);border-color:var(--speak);font-weight:700}
.sm .w.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.sm .w.miss{border:2px dashed var(--ok);color:var(--ok)}
.sm .w.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* home */
.hero{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.hero p{color:var(--muted);font-size:1.02rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.card b{font-family:var(--f-display);color:var(--brand);font-size:.95rem}
.card .t{font-weight:600}
.card .s{font-size:.82rem;color:var(--muted)}
.card.done{border-color:var(--ok)}
.card.rv{background:var(--brand-soft);border-color:transparent}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:70ch}
/* chuyên đề */
.co{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.95rem;min-height:36px}
.co.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.co.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.pr{display:flex;flex-direction:column;gap:12px}
.pr .qi[data-done] .co:not(.right):not(.wrong){opacity:.55}
.pr input.ok{border-color:var(--ok);background:var(--ok-soft)} .pr input.no{border-color:var(--bad);background:var(--bad-soft)}
.lv{font-size:.7rem;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.lv.l2{background:var(--listen-soft);color:var(--listen)} .lv.l3{background:var(--write-soft);color:var(--write)}
u.ep{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:600}
.qq sub{font-size:.7rem;font-weight:700;color:var(--brand);margin:0 3px 0 1px}
.sum{background:var(--sunk);border-radius:8px;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipl{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;text-decoration:none;color:var(--ink)}
.chipl.on{background:var(--brand);border-color:var(--brand);color:var(--surface);font-weight:600}
.dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;margin:0 4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.55}
.dots i.b{width:16px;height:16px;background:var(--speak);opacity:1}
.spells{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.spell{border-left:3px solid var(--speak);background:var(--speak-soft);border-radius:0 8px 8px 0;padding:8px 12px;display:flex;flex-direction:column}
.spellin{font-family:var(--f-display);font-weight:700;color:var(--speak);font-size:1.05rem}
.wchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
.wchip.nw{border-style:dashed}
.wl{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.wl>div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:var(--sunk);border-radius:999px;padding:3px 12px;font-size:.85rem}
.fc{border:2px solid var(--speak);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:stretch;max-width:560px;margin:0 auto;width:100%;text-align:center}
.fc-top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.fc-w{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.syl.big{font-size:1.5rem;padding:10px 18px;min-width:64px;font-family:var(--f-display)}
.fc-fb{display:flex;flex-direction:column;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:1.8rem;color:var(--brand);line-height:1.1}
.stats span{font-size:.85rem;color:var(--muted)}
.cdc .bad{color:var(--bad)}
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wli{border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:.92rem}
.wli .yes{color:var(--ok);font-weight:600}
nav.rail a span.badge{flex:none}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
.hero-cd{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
@media (max-width:520px){.syl.big{font-size:1.25rem;padding:8px 12px;min-width:52px}.fc{padding:14px}}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:fixed;inset:0 auto 0 0;width:min(280px,85vw);background:var(--surface);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px 20px;max-height:none;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .2s}
  nav.rail.open{transform:none}
  .menu-btn{display:inline-block}
  h1{font-size:1.6rem}
  .ctl .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const IC={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
 rec:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>',

};
const sayBtn=(t,label)=>`<button class="say" data-say="${esc(t)}" aria-label="Nghe: ${esc(label||t)}">${IC.spk}</button>`;

/* ---------- storage ---------- */
const KEY="ta5hk1";
let S={rate:"0.85",voice:"",done:{},best:{},drafts:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- speech synthesis ---------- */
const TTS=("speechSynthesis" in window)?window.speechSynthesis:null;
let VOICES=[];
function loadVoices(){
  if(!TTS)return;
  VOICES=TTS.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==="en");
  const sel=$("#voiceSel");
  sel.innerHTML='<option value="">Mặc định</option>'+VOICES.map(v=>`<option value="${esc(v.name)}">${esc(v.name.replace(/Microsoft |Google /,""))} (${esc(v.lang)})</option>`).join("");
  sel.value=S.voice&&VOICES.some(v=>v.name===S.voice)?S.voice:"";
}
function voiceFor(slot){
  if(!VOICES.length)return null;
  const chosen=VOICES.find(v=>v.name===S.voice);
  const pref=VOICES.filter(v=>/en-(GB|US)/i.test(v.lang));
  const base=chosen||pref[0]||VOICES[0];
  if(!slot)return base;
  const other=(pref.length?pref:VOICES).find(v=>v.name!==base.name);
  return other||base;
}
function speak(text,opt={}){
  return new Promise(res=>{
    if(!TTS){flash("Trình duyệt này không có giọng đọc. Hãy thử Chrome hoặc Edge.");return res()}
    const u=new SpeechSynthesisUtterance(text);
    const v=voiceFor(opt.slot);if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.rate=parseFloat(opt.rate||S.rate);u.pitch=opt.pitch||1;
    u.onend=res;u.onerror=res;
    TTS.speak(u);
  });
}
function stopSpeak(){if(TTS)TTS.cancel()}
async function playDialogue(lines){
  stopSpeak();
  const names=[...new Set(lines.map(l=>l[0]))];
  for(const [who,t] of lines){
    const idx=names.indexOf(who)%2;
    await speak(t,{slot:idx,pitch:idx?1.15:1});
    await new Promise(r=>setTimeout(r,250));
  }
}

/* ---------- speech recognition & recording ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SR_MSG={"not-allowed":"Micro đang bị chặn. Nếu em đang xem trên claude.ai, hãy tải file HTML về và mở bằng Chrome hoặc Edge, rồi cho phép dùng micro.","service-not-allowed":"Máy chưa cho dùng nhận dạng giọng nói ở đây. Hãy mở file HTML bằng Chrome hoặc Edge.","no-speech":"Chưa nghe thấy tiếng. Em nói to và rõ hơn nhé.","network":"Nhận dạng giọng nói cần kết nối mạng. Kiểm tra mạng rồi thử lại.","audio-capture":"Không tìm thấy micro. Kiểm tra micro hoặc tai nghe.","nosupport":"Trình duyệt này không chấm được phát âm. Hãy dùng Chrome hoặc Edge trên máy tính hoặc Android."};
function recognize(){
  return new Promise((resolve,reject)=>{
    if(!SR)return reject("nosupport");
    let r;try{r=new SR()}catch(e){return reject("nosupport")}
    r.lang="en-US";r.interimResults=false;r.maxAlternatives=4;
    let got=false;
    r.onresult=e=>{got=true;const alts=[];for(const a of e.results[0])alts.push(a.transcript);resolve(alts)};
    r.onerror=e=>reject(e.error||"no-speech");
    r.onend=()=>{if(!got)reject("no-speech")};
    try{r.start()}catch(e){reject("not-allowed")}
  });
}
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){n=+n;if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");if(n<1000)return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+numWords(n%100):"");return String(n)}
function toks(s){
  return s.toLowerCase().replace(/[’‘]/g,"'").replace(/\d+/g,m=>" "+numWords(m)+" ").replace(/[^a-z' ]+/g," ").split(/\s+/).filter(Boolean)
    .map(w=>w.replace(/^'+|'+$/g,""));
}
function matchWords(target,heard){
  const a=toks(target),b=toks(heard);
  const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(a.length).fill(false);let i=0,j=0;
  while(i<a.length&&j<b.length){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return {words:a,ok,score:a.length?ok.filter(Boolean).length/a.length:0};
}
let recState=null;
async function toggleRecord(btn,box){
  if(recState&&recState.btn===btn){recState.mr.stop();return}
  if(recState){recState.mr.stop()}
  const recFb=`<div class="heard">Trình duyệt không cho ghi âm trực tiếp. Bấm nút dưới để mở <b>máy ghi âm của điện thoại</b>, ghi xong bấm OK để nghe lại tại đây.</div><input type="file" accept="audio/*" capture data-recfile="1" aria-label="Ghi âm bằng điện thoại">`;
  if(!navigator.mediaDevices||!window.MediaRecorder||window.isSecureContext===false){box.innerHTML=recFb;return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream);const chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());btn.classList.remove("live");btn.innerHTML=IC.rec+"Ghi âm";recState=null;
      const url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||"audio/webm"}));
      box.innerHTML=`<audio controls src="${url}" style="max-width:100%;height:36px"></audio>`};
    mr.start();recState={mr,btn};btn.classList.add("live");btn.innerHTML=IC.rec+"Dừng";
  }catch(e){box.innerHTML=recFb}
}
const MIC_OK=()=>!!SR&&window.isSecureContext!==false;
function kbBox(target,key,why){
  return `<div class="kb" data-kbt="${esc(target)}" data-key="${esc(key||"")}">
    <div class="heard">${why||"Trang đang mở ở chế độ trình duyệt không cho dùng micro trực tiếp."} Cách chấm thay thế: bấm vào ô dưới, chạm <b>biểu tượng micro trên bàn phím</b> (Gboard hoặc bàn phím iPhone), đọc to câu tiếng Anh, rồi bấm <b>Chấm</b>. Nhớ chuyển bàn phím sang <b>English</b> trước khi nói, nếu không máy sẽ nghe thành chữ tiếng Việt.</div>
    <div class="row"><input class="dict" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Bấm vào đây rồi chạm micro trên bàn phím" style="flex:1;min-width:0"><button class="btn pri" data-kbcheck="1">Chấm</button></div><div class="kbout"></div></div>`;
}
function showScore(box,target,alts,key){
    let best=null,heard="";
    for(const a of alts){const m=matchWords(target,a);if(!best||m.score>best.score){best=m;heard=a}}
    const pct=Math.round(best.score*100);
    const cls=pct>=85?"good":pct>=60?"mid":"low";
    const msg=pct>=85?"Rất tốt!":pct>=60?"Khá rồi. Nghe lại mẫu và luyện từ màu đỏ.":"Chưa rõ. Nghe mẫu chậm rồi nói lại từng cụm.";
    box.innerHTML=`<div class="res">${best.words.map((w,i)=>`<span class="w ${best.ok[i]?"ok":"no"}">${esc(w)}</span>`).join("")}</div>
      <div class="row"><span class="score ${cls}">${pct}%</span><span>${msg}</span></div><div class="heard">Máy nghe được: “${esc(heard)}”</div>`;
    if(key){S.best[key]=Math.max(S.best[key]||0,pct);save()}
}
async function doRecognize(btn,target,box,key){
  stopSpeak();
  if(!MIC_OK()){box.innerHTML=kbBox(target,key);return}
  const old=btn.innerHTML;btn.classList.add("live");btn.innerHTML=IC.mic+"Đang nghe…";
  try{const alts=await recognize();showScore(box,target,alts,key)}
  catch(err){box.innerHTML=["not-allowed","service-not-allowed","nosupport"].includes(err)?kbBox(target,key,"Trình duyệt đang chặn micro."):`<span class="heard">${esc(SR_MSG[err]||SR_MSG["no-speech"])}</span>`}
  btn.classList.remove("live");btn.innerHTML=old;
}

/* ---------- small UI helpers ---------- */
function flash(t){let f=$("#flash");if(!f){f=document.createElement("div");f.id="flash";f.style.cssText="position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:30;max-width:90vw";document.body.appendChild(f)}f.textContent=t;f.hidden=false;clearTimeout(f._t);f._t=setTimeout(()=>f.hidden=true,3500)}
function mindmap(center,branches){
  return `<div class="mm"><div class="mm-c">${center}</div><div class="mm-stem"></div><div class="mm-bs">${branches.map(b=>`<div class="mm-b ${b.k?"k-"+b.k:""}"><h4>${b.label}</h4><ul>${b.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
}
function sec(title,tag,body,id){return `<section class="sec"${id?` id="${id}"`:""}><div class="sh"><h2>${title}</h2>${tag?`<span class="tag">${tag}</span>`:""}</div>${body}</section>`}
function stressHTML(s){
  const shown=esc(s).replace(/\b([A-Z]{2,}[A-Z']*|[A-Z](?=-))/g,"<em>$1</em>");
  return shown.replace(/-/g,"·");
}
function plainOf(s){let p=s.split(" /")[0].replace(/[↘↗]/g,"").replace(/-/g,"").trim().toLowerCase();p=p.replace(/\bi\b/g,"I").replace(/\bi'm\b/g,"I'm");return p.charAt(0).toUpperCase()+p.slice(1)}

/* ---------- quiz engine ---------- */
let QZ={};let qzSeq=0;
function quiz(items,key){
  const id="q"+(++qzSeq);QZ[id]={items,key};
  return `<div class="qz" data-qz="${id}">${items.map((it,i)=>`<div class="qi" data-i="${i}">
    <div class="qq"><span class="qn">${i+1}.</span>${it.audio?`<button class="btn l" data-say="${esc(it.audio)}">${IC.play}Nghe</button>`:""}<span>${it.qh||esc(it.q)}</span></div>
    <div class="opts">${it.opts.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="fb" hidden></div></div>`).join("")}
    <div class="row"><button class="btn pri" data-check="${id}">Kiểm tra</button><span class="qres"></span></div></div>`;
}
function checkQuiz(id){
  const box=$(`[data-qz="${id}"]`),Q=QZ[id];let right=0;
  Q.items.forEach((it,i)=>{
    const qi=$(`.qi[data-i="${i}"]`,box);const sel=$(".opt.sel",qi);
    $$(".opt",qi).forEach(o=>o.classList.remove("right","wrong"));
    $$(".opt",qi)[it.ans].classList.add("right");
    const okk=sel&&+sel.dataset.j===it.ans;if(okk)right++;else if(sel)sel.classList.add("wrong");
    if(sel&&Q.key&&!/-(doc|nghe|3)$/.test(Q.key)&&typeof srHit==="function"){const tq=it.qh||esc(it.q||"");srHit("g:"+Q.key+":"+hash(tq+it.opts.join()),okk,{k:"g",t:Q.key.split("-")[0],snap:{k:"mc",q:tq,opts:it.opts,ans:it.ans,fb:it.fb,say:it.audio}})}
    const fb=$(".fb",qi);if(it.fb){fb.hidden=false;fb.innerHTML=it.fb}
  });
  const pct=Math.round(right/Q.items.length*100);
  $(".qres",box).innerHTML=`<span class="score ${pct>=80?"good":pct>=50?"mid":"low"}">${right}/${Q.items.length}</span> ${pct===100?"Đúng hết!":"Xem lại câu sai (màu đỏ), đáp án đúng có màu xanh."}`;
  if(Q.key){S.best[Q.key]=Math.max(S.best[Q.key]||0,pct);save()}
}

/* ---------- builders for exercises ---------- */
function vocabQuiz(u){
  const words=u.vocab.map(v=>v[0]);
  return pick(u.vocab,6).map((v,i)=>{
    if(i%2===0){const opts=shuffle([v[0],...pick(words.filter(w=>w!==v[0]),3)]);return {q:"Nghe và chọn từ em vừa nghe:",audio:v[0],opts,ans:opts.indexOf(v[0]),fb:`${esc(v[0])}: ${esc(v[2])}`}}
    const vis=u.vocab.map(x=>x[2]);const opts=shuffle([v[2],...pick(vis.filter(w=>w!==v[2]),3)]);
    return {q:"",qh:`<span class="en">${esc(v[0])}</span> nghĩa là gì?`,opts,ans:opts.indexOf(v[2])};
  });
}
function fillItems(u,n){
  const all=u.pat.flatMap(p=>p.fill.map(f=>({f,p})));
  return pick(all,n).map(({f,p})=>{const opts=shuffle(f[2]);return {q:f[0],opts,ans:opts.indexOf(f[1]),fb:`Mẫu: ${esc(p.form[1])}`}});
}
function listenItems(pool,n){
  return pick(pool,n).map(t=>{const others=pick(pool.filter(x=>x!==t),2);const opts=shuffle([t,...others]);return {q:"Nghe rồi chọn câu đúng:",audio:t,opts,ans:opts.indexOf(t)}});
}
function reorderHTML(sents,key){
  return sents.map((s,i)=>{const w=s.split(" ");let sh=shuffle(w);let k=0;while(sh.join(" ")===s&&k++<5)sh=shuffle(w);

const micNote=()=>`<div class="micnote"><b>Cách dùng phần chấm phát âm.</b> Bấm <b>Nói và chấm</b> rồi đọc to câu tiếng Anh. Máy tô xanh từ nghe rõ, tô đỏ từ chưa rõ. Cần có mạng.${MIC_OK()?"":" <b>Trình duyệt đang không cho dùng micro trực tiếp</b> (thường gặp khi mở file tải về trên điện thoại, hoặc xem trong claude.ai). Khi bấm Nói và chấm, trang sẽ hiện ô để em nói qua <b>micro của bàn phím</b>, máy vẫn chấm như thường."}</div>`;
function writeChecker(u,text){
  const t=text.trim();
  if(!t)return `<span class="heard">Em viết bài vào ô trên, phần kiểm tra tự cập nhật.</span>`;
  const sents=t.split(/(?<=[.!?])\s+/).filter(s=>s.trim());
  const words=toks(t).length;
  const capOK=sents.every(s=>/^[A-Z"']/.test(s.trim()));
  const endOK=/[.!?]$/.test(t);
  const iOK=!/(^|[\s,])i(\s|'|$)/.test(t);
  const lower=t.toLowerCase();
  const vocabHit=u.vocab.filter(v=>lower.includes(v[0].toLowerCase())).map(v=>v[0]);
  const rows=[
    [words>=25,`Độ dài: ${words} từ ${words>=25?"(đủ)":"(nên viết ít nhất 25 từ, khoảng 4–5 câu)"}`],
    [sents.length>=4,`Số câu: ${sents.length} ${sents.length>=4?"":"(cần ít nhất 4 câu)"}`],
    [capOK,capOK?"Câu nào cũng viết hoa chữ cái đầu":"Có câu chưa viết hoa chữ cái đầu"],
    [endOK,endOK?"Có dấu chấm cuối câu":"Câu cuối thiếu dấu chấm (.), chấm hỏi (?) hoặc chấm than (!)"],
    [iOK,iOK?"Chữ I (tôi) luôn viết hoa":"Chữ i (tôi) phải viết hoa: I"],
    ...u.write.keys.map(([re,lab])=>{const ok=new RegExp(re,"i").test(t);return [ok,ok?`Có ${lab}`:`Chưa có ${lab}`]}),
    [vocabHit.length>=2,`Dùng từ của bài: ${vocabHit.length?vocabHit.map(esc).join(", "):"chưa có"}`]
  ];
  const n=rows.filter(r=>r[0]).length;
  return `<ul class="chk">${rows.map(r=>`<li><span class="${r[0]?"y":"n"}">${r[0]?"✓":"✗"}</span><span>${r[1]}</span></li>`).join("")}</ul><div class="row" style="margin-top:6px"><span class="score ${n===rows.length?"good":n>=rows.length-2?"mid":"low"}">${n}/${rows.length} mục đạt</span></div><div class="heard">Máy chỉ kiểm tra hình thức. Bố mẹ hoặc thầy cô đọc thêm để xem ý có đúng, có hay không.</div>`;
}

/* ---------- grammar ---------- */
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[–—-]/g," ").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim();
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
let gSeq=0;
function typed(i,given,acc,hint,instr,bad){
  const id="g"+(++gSeq);
  return `<div class="qi" data-acc="${esc(JSON.stringify(acc))}"><div class="qq"><span class="qn">${i+1}.</span>${instr?`<span>${fmt(instr)}</span>`:""}</div>
   <div style="padding-left:2em" class="given${bad?" bad":""}">${bad?"✗ ":""}${esc(given)}</div>
   <div style="padding-left:2em"><input class="dict" id="${id}" autocomplete="off" spellcheck="false" placeholder="Gõ câu đúng…"></div>
   <div class="row" style="padding-left:2em"><button class="btn" data-gcheck="1">Kiểm tra</button>${hint?`<button class="btn" data-hint="${esc(hint)}">Gợi ý</button>`:""}<span class="out"></span></div></div>`;
}
function grammarMCQ(list){return list.map(m=>{const o=shuffle(m[2]);return {q:m[0],opts:o,ans:o.indexOf(m[1])}})}
function grammarTab(u){

    <div class="note"><b>Ghi nhớ.</b> ${esc(p.tip)}</div>
    <div><h3>Lỗi hay gặp</h3><ul class="mist">${p.mist.map(m=>`<li><span class="no">✗ ${esc(m[0])}</span><span class="yes">✓ ${esc(m[1])}</span><span class="why">${esc(m[2])}</span></li>`).join("")}</ul></div>
    <div><h3>Hỏi nhanh để kiểm tra hiểu bài</h3><p class="heard">Bố mẹ hỏi con câu này, con trả lời rồi bấm để xem đáp án.</p>${p.ccq.map(c=>`<details class="ccq"><summary>${esc(c[0])}</summary><p>${esc(c[1])}</p></details>`).join("")}</div>`)).join("")
  + sec("Luyện ngữ pháp","Từ dễ đến khó",`
    <h3>Bài 1. Chọn đáp án đúng</h3>${quiz(grammarMCQ(g.mcq),key+"-np1")}
    <h3>Bài 2. Tìm và sửa lỗi</h3><p class="heard">Mỗi câu có đúng một lỗi. Gõ lại cả câu cho đúng.</p>${g.err.map((e,i)=>typed(i,e[0],e[1],e[2],"",true)).join("")}
    <h3>Bài 3. Viết lại câu</h3>${g.tr.map((t,i)=>typed(i,t[1],t[2],null,t[0])).join("")}

      <div style="padding-left:2em"><input class="dict" id="gf-${key}-${i}" autocomplete="off" placeholder="Viết câu của em…"></div>
      <div class="row" style="padding-left:2em"><button class="btn" data-fcheck="1">Kiểm tra</button><button class="btn" data-showex="1">Xem ví dụ</button><span class="out"></span></div></div>`).join("")}`);

/* ---------- phonetics ---------- */
function P(s){const [w,i]=s.split("|");const syl=w.split("·");return {syl,idx:+i,word:syl.join(""),n:syl.length}}
function sw(s){const p=P(s);return `<span class="sw">${p.syl.map((x,i)=>i===p.idx?`<em>${esc(x)}</em>`:esc(x)).join("·")}</span>`}
const sentHTML=s=>esc(s).replace(/\[([^\]]+)\]/g,"<em>$1</em>");
const sentPlain=s=>s.replace(/[\[\]]/g,"");
function sentCard(s,key,i){const t=sentPlain(s);return `<div class="sp"><div class="ss">${sentHTML(s)}</div>
   <div class="row"><button class="btn l" data-say="${esc(t)}">${IC.spk}Nghe mẫu</button><button class="btn l" data-say="${esc(t)}" data-rate="0.6">${IC.spk}Nghe chậm</button>
   <button class="btn s" data-rec-say="${esc(t)}" data-key="${key}-${i}">${IC.mic}Nói và chấm</button><button class="btn rec" data-record="1">${IC.rec}Ghi âm</button></div><div class="out"></div><div class="aud"></div></div>`}
const ordinal=["thứ nhất","thứ hai","thứ ba","thứ tư"];
function oddItems(pool,n){
  const ps=pool.map(P),items=[],seen=new Set();
  for(let tries=0;items.length<n&&tries<200;tries++){
    const c=pick([2,2,2,3],1)[0];const same=ps.filter(p=>p.n===c);
    const groups={};same.forEach(p=>(groups[p.idx]=groups[p.idx]||[]).push(p));
    const keys=Object.keys(groups);const big=keys.filter(k=>groups[k].length>=3);if(!big.length||keys.length<2)continue;
    const kb=pick(big,1)[0];const ko=pick(keys.filter(k=>k!==kb),1)[0];
    const odd=pick(groups[ko],1)[0];const rest=pick(groups[kb],3);
    const opts=shuffle([odd,...rest]);const sig=opts.map(o=>o.word).sort().join();if(seen.has(sig))continue;seen.add(sig);
    items.push({q:"",qh:"Chọn từ có trọng âm khác với các từ còn lại:",opts:opts.map(o=>o.word),ans:opts.indexOf(odd),
      fb:opts.map(o=>sw(o.syl.join("·")+"|"+o.idx)).join(" · ")+`<br>${esc(odd.word)} nhấn âm ${ordinal[odd.idx]}, ba từ kia nhấn âm ${ordinal[+kb]}.`});
  }
  return items;
}
function endItems(kind,n){
  const E=ENDINGS[kind];const items=[];
  for(let i=0;i<n;i++){
    const [lo,...others]=shuffle(E.labels);const odd=pick(E.words[lo],1)[0];const other=pick(others,1)[0];const rest=pick(E.words[other],3);
    const opts=shuffle([odd,...rest]);
    items.push({q:"",qh:`Chọn từ có phần gạch chân phát âm khác:`,opts,ans:opts.indexOf(odd),fb:`${esc(odd)} đọc đuôi ${lo}; ba từ kia đọc ${other}.`});
  }
  return items;
}
function under(kind,w){const k=ENDINGS[kind].under(w);return esc(w.slice(0,k))+`<u class="end">${esc(w.slice(k))}</u>`}
function sortRows(kind,n){
  const E=ENDINGS[kind];const ws=pick(E.labels.flatMap(l=>E.words[l].map(w=>[w,l])),n);
  return ws.map(([w,l],i)=>`<div class="qi" data-sort="${esc(l)}"><div class="qq"><span class="qn">${i+1}.</span>${sayBtn(w)}<span class="en">${under(kind,w)}</span></div><div class="opts">${E.labels.map(x=>`<button class="opt" data-pick="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="fb" hidden></div></div>`).join("");
}
function sylRows(pool,n){
  return pick(pool,n).map((s,i)=>{const p=P(s);return `<div class="qi" data-sylans="${p.idx}"><div class="qq"><span class="qn">${i+1}.</span>${sayBtn(p.word)}<span class="heard">Nghe rồi bấm vào âm tiết được nhấn</span></div><div class="syls">${p.syl.map((x,j)=>`<button class="syl" data-syl="${j}">${esc(x)}</button>`).join("")}</div></div>`}).join("");
}
function intoItems(u){
  const qs=[...new Set(u.pat.flatMap(p=>p.ex.map(e=>e[0])).concat(u.speak).filter(t=>/\?$/.test(t)&&!/^Could/.test(t)))];
  return pick(qs,Math.min(4,qs.length)).map(t=>{const yn=/^(Do|Does|Did|Are|Is|Were|Was|Can)\b/.test(t);return {q:t,audio:t,opts:["Lên giọng ↗","Xuống giọng ↘"],ans:yn?0:1,fb:yn?"Câu hỏi Yes/No: lên giọng ở cuối.":"Câu hỏi Wh-: xuống giọng ở cuối."}});
}
function markRows(pool,n){
  return pick(pool,n).map((s,i)=>{const p=P(s);return `<div class="qi" data-markans="${p.idx}" data-w="${esc(p.word)}"><div class="mk"><span class="qn" style="margin-left:-2em;min-width:2em">${i+1}.</span>${p.syl.map((x,j)=>`<button class="syl" data-mark="${j}">${esc(x)}</button>`).join("")}<span class="fb2"></span></div></div>`}).join("")
   + `<div class="row"><button class="btn pri" data-markcheck="1">Kiểm tra</button><span class="qres"></span></div>`;
}
const LAB=["Nhấn âm 1","Nhấn âm 2","Nhấn âm 3"];
function colRows(pool,n){
  const ws=pick(pool,n).map(P);const max=Math.max(...ws.map(p=>p.n));const k=Math.min(3,max);
  return `<div data-colbox="${k}">`+ws.map((p,i)=>`<div class="qi" data-colans="${p.idx}" data-word="${esc(p.word)}"><div class="qq"><span class="qn">${i+1}.</span><span class="en">${esc(p.word)}</span><span class="heard">(${p.n} âm tiết)</span></div><div class="opts">${LAB.slice(0,Math.min(p.n,3)).map((l,j)=>`<button class="opt" data-col="${j}">${l}</button>`).join("")}</div></div>`).join("")
   + `<div class="row"><button class="btn pri" data-colcheck="1">Kiểm tra</button><span class="qres"></span></div><div class="cols" hidden></div></div>`;
}
const FUNC=new Set("a an the to at in on of is are am was were i i'm he's she's it's they're we he she it they we you my your his her our their and or but for with do does did be".split(" "));
function smRows(sents){
  return sents.map((s,i)=>{const toks=s.split(" ");return `<div class="qi" data-sm><div class="qq"><span class="qn">${i+1}.</span><span class="heard">Bấm vào các từ được nhấn trong câu</span></div><div class="sm">${toks.map(t=>`<button class="w" data-st="${/\[/.test(t)?1:0}" data-fn="${FUNC.has(t.replace(/[\[\].,!?]/g,"").toLowerCase())?1:0}">${esc(t.replace(/[\[\]]/g,""))}</button>`).join("")}</div>
   <div class="row" style="padding-left:2em"><button class="btn" data-smcheck="1">Kiểm tra</button><button class="btn l" data-say="${esc(sentPlain(s))}">${IC.play}Nghe câu</button><span class="out"></span></div></div>`}).join("");
}
function ruleCard(id){const r=PRULES[id];return `<div class="rule"><h3>${esc(r.t)}</h3><p>${esc(r.body)}</p>${r.ex.length?`<div class="row">${r.ex.map(e=>`${sayBtn(P(e).word)}${sw(e)}`).join("&nbsp;&nbsp;")}</div>`:""}</div>`}
function phonTab(u){
  const ph=PHON[u.n],key="u"+u.n;let n=0;const num=()=>++n;
  return sec(`Trọng âm trong SGK Unit ${u.n}`,"Lesson 3 · Listen and repeat",`<p><b>Trọng tâm:</b> ${esc(ph.focus)}.</p>
      <div class="row">${ph.sgk.map(s=>`${sayBtn(P(s).word)}${sw(s)}`).join("&nbsp;&nbsp;&nbsp;")}</div>
      <p class="heard">Phần tô màu, gạch chân là âm tiết được nhấn. Đọc to âm tiết đó, kéo dài hơn một chút.</p>
      ${ph.sents.map((s,i)=>sentCard(s,key+"-na",i)).join("")}`)
   + sec("Quy tắc cần nhớ",`${ph.rules.length} quy tắc`,`<div class="rules">${ph.rules.map(ruleCard).join("")}</div>`)
   + sec("Luyện ngữ âm","Từ dễ đến khó",`
      <h3>Bài ${num()}. Đánh dấu trọng âm</h3><p class="heard">Làm như trên giấy, chưa nghe. Bấm vào âm tiết được nhấn để đặt dấu ˈ trước âm tiết đó, bấm lại để bỏ. Làm xong bấm Kiểm tra, rồi nghe lại để nhớ.</p>${markRows(ph.pool,8)}
      <h3>Bài ${num()}. Nghe và bấm vào âm tiết được nhấn</h3>${sylRows(ph.pool,6)}
      <h3>Bài ${num()}. Xếp từ vào cột theo vị trí trọng âm</h3>${colRows(ph.pool,8)}
      <h3>Bài ${num()}. Chọn từ có trọng âm khác</h3><p class="heard">Dạng bài hay gặp trong đề kiểm tra. Đọc thầm từng từ, tìm từ nhấn khác chỗ.</p><div data-gen="odd">${quiz(oddItems(ph.pool,4),key+"-na2")}</div><div class="row"><button class="btn" data-regen="odd">Đổi câu khác</button></div>
      ${ph.ending?`<h3>Bài ${num()}. Đuôi ${ph.ending==="s"?"-s / -es":"-ed"} đọc là gì?</h3><p class="heard">Nghe từng từ rồi chọn cách đọc của phần gạch chân.</p>${sortRows(ph.ending,6)}<div class="row"><button class="btn pri" data-sortcheck="1">Kiểm tra</button><span class="qres"></span></div>
        <h3>Bài ${num()}. Chọn từ có phần gạch chân phát âm khác</h3>${quiz(endItems(ph.ending,3).map(it=>Object.assign(it,{opts:it.opts})),key+"-na3").replace(/<button class="opt" data-j="(\d+)">([^<]+)<\/button>/g,(m,j,w)=>`<button class="opt" data-j="${j}">${under(ph.ending,w)}</button>`)}`:""}
      <h3>Bài ${num()}. Đánh trọng âm câu</h3><p class="heard">Từ được nhấn là từ mang nghĩa (danh từ, động từ chính, tính từ, trạng từ). Các từ nhỏ như a, the, is, my, at không được nhấn.</p>${smRows(ph.sents.concat(ph.extra||[]))}
      ${ph.rules.includes("R9")?`<h3>Bài ${num()}. Lên giọng hay xuống giọng?</h3><p class="heard">Nghe câu hỏi, chọn ngữ điệu ở cuối câu.</p>${quiz(intoItems(u),key+"-na4")}`:""}`);
}

/* ---------- views ---------- */
const TABS=[["so-do","Sơ đồ"],["tu-vung","Từ vựng"],["mau-cau","Mẫu câu"],["ngu-phap","Ngữ pháp"],["ngu-am","Ngữ âm"],["nghe","Nghe"],["noi","Nói"],["doc","Đọc"],["viet","Viết"]];

   <div class="grp">Unit 1–5</div>${UNITS.slice(0,5).map(u=>it("u"+u.n,u.n,u.t,S.done["u"+u.n])).join("")}${it("r1","R1","Review 1",S.done.r1)}
   <div class="grp">Unit 6–10</div>${UNITS.slice(5).map(u=>it("u"+u.n,u.n,u.t,S.done["u"+u.n])).join("")}${it("r2","R2","Review 2",S.done.r2)}
   <div class="grp">Chuyên đề</div><a href="#on" class="${cur==="on"?"on":""}"><b>↻</b><span>Ôn hôm nay</span><span class="badge" id="dueBadge" hidden></span></a>${it("cd","☰","Tất cả chuyên đề")}${it("cd/trong-am","ˈ","Trọng âm")}${CDT.map(t=>it("cd/"+t.id,"•",t.t)).join("")}`;
}
function viewHome(){
  const total=12,done=["u1","u2","u3","u4","u5","u6","u7","u8","u9","u10","r1","r2"].filter(k=>S.done[k]).length;
  const map=mindmap("Tiếng Anh 5 · Học kì 1",[
    {k:"nghe",label:"Nghe",items:["Hội thoại ngắn theo chủ đề","Nghe và chọn đáp án","Nghe chép chính tả"]},
    {k:"noi",label:"Nói",items:["Trọng âm, ngữ điệu, đuôi -ed","Nói theo mẫu, máy chấm","Hỏi – đáp về bản thân"]},
    {k:"doc",label:"Đọc",items:["Đoạn văn 60–80 từ","Đúng / Sai (True / False)","Bấm từ để nghe đọc"]},
    {k:"viet",label:"Viết",items:["Sắp xếp từ thành câu","Viết đoạn 4–6 câu theo sơ đồ","Tự kiểm tra, xem bài mẫu"]},
    {k:"noi",label:"Ngữ âm",items:["Trọng âm từ 2 và 3 âm tiết","Trọng âm câu, ngữ điệu","Đuôi -s / -es và -ed"]},
    {k:"mau",label:"Ngữ pháp",items:["Cấu trúc, ví dụ, ghi nhớ","Lỗi người Việt hay mắc","Chọn, sửa lỗi, viết lại, tự đặt câu"]},

function reviewTest(r){

/* ================= CHUYÊN ĐỀ: data, spaced repetition, views ================= */
const RN=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const TODAY=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const INT=[0,1,2,4,7,14];
S.sr=S.sr||{};
/* ---- Leitner boxes: b=1..5 (5 = đã thuộc), d = ngày ôn tiếp ---- */
function srHit(id,ok,o){
  o=o||{};let r=S.sr[id];const td=TODAY();
  if(!r){ if(ok&&!o.track) return; r=S.sr[id]={b:0,n:0,t:o.t||"",k:o.k||"g"}; }
  if(o.snap) r.it=o.snap;
  if(ok){ r.b=r.b?Math.min(r.b+1,5):3; r.d=td+INT[r.b]; }
  else { r.b=1; r.n=(r.n||0)+1; r.d=td; r.w=Date.now(); }
  const ids=Object.keys(S.sr);
  if(ids.length>800){ ids.filter(i=>S.sr[i].b>=5).sort((a,b)=>(S.sr[a].w||0)-(S.sr[b].w||0)).slice(0,ids.length-800).forEach(i=>delete S.sr[i]); }
  save();
}
const isDue=r=>r.b<5&&r.d<=TODAY();
const dueList=k=>Object.entries(S.sr).filter(([id,r])=>r.k===k&&isDue(r));

    if(parts.length!==4) return null;
    return {k:"mc",q:`Tìm lỗi sai: ${q.replace(/&lt;|&gt;/g,"")}`,opts:["A","B","C","D"],ans:it.w,fb:`Lỗi ở ${"ABCD"[it.w]}: <s>${esc(parts[it.w])}</s> → <b>${esc(it.fix)}</b>. ${it.fb}`,letters:1}}

function genRound(tp,L,n){
  const out=[],sig=new Set(),seen=SEEN[tp.id]=SEEN[tp.id]||new Set();
  for(let tries=0;out.length<n&&tries<400;tries++){
    const lv=L==="mix"?1+tries%3:+L;const fns=tp.gen[lv];let it;
    try{it=normItem(RN(fns)())}catch(e){it=null}
    if(!it) continue;const s=qText(it)+"|"+(it.opts?it.opts.join():it.acc.join());
    if(sig.has(s)) continue; if(seen.has(s)&&tries<300) continue;
    sig.add(s);seen.add(s);it.lv=lv;out.push(it);
  }
  return out;
}

let FC=null;
function fcStart(){
  const due=dueList("w").map(([id])=>id.slice(2)).filter(w=>SW[w]);
  const fresh=shuffle(SWL.filter(x=>!x.nw&&!S.sr["w:"+x.p.word]).map(x=>x.p.word));
  const learning=shuffle(SWL.filter(x=>S.sr["w:"+x.p.word]&&S.sr["w:"+x.p.word].b<5&&!due.includes(x.p.word)).map(x=>x.p.word));
  const q=shuffle(due).slice(0,10);for(const w of fresh.concat(learning)){if(q.length>=10)break;if(!q.includes(w))q.push(w)}
  FC={q,i:0,right:0,again:new Set(),hint:false,n:q.length};return fcCard();
}
function fcCard(){
  if(!FC||FC.i>=FC.q.length){const r=FC?FC.right:0;return `<div class="fc"><div class="fc-w">Xong lượt!</div><p><span class="score good">${r}</span> lần trả lời đúng. ${FC&&FC.again.size?"Các từ sai sẽ quay lại vào ngày mai.":""}</p><div class="row"><button class="btn pri" data-fc="new">Làm thêm 10 thẻ</button><a class="btn" href="#on">Về Ôn hôm nay</a></div></div>`}
  const w=FC.q[FC.i],x=SW[w];const r=S.sr["w:"+w];
  return `<div class="fc" data-fcw="${esc(w)}"><div class="fc-top"><span>Thẻ ${FC.i+1}/${FC.q.length}</span><span class="pill">${r?(r.b>=5?"Đã thuộc":"Đang ôn · hộp "+r.b):"Từ mới"}</span></div>
    <div class="fc-w">${x.p.syl.map((s,j)=>`<button class="syl big" data-fcs="${j}">${esc(s)}</button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn l" data-fc="hint">${IC.spk}Nghe gợi ý</button><span class="heard">Thử đoán trước rồi mới nghe, sẽ nhớ lâu hơn.</span></div><div class="fc-fb"></div></div>`;
}
function fcAnswer(j){
  const box=$(".fc");if(!box||box.dataset.ans)return;box.dataset.ans=1;const w=box.dataset.fcw,x=SW[w];const ok=j===x.p.idx&&!FC.hint;
  const b=$$(".syl",box);b[x.p.idx].classList.add("right");if(j!==x.p.idx)b[j].classList.add("wrong");
  if(j===x.p.idx)FC.right++;
  srHit("w:"+w,ok,{k:"w",t:"trong-am",track:true});
  if(!ok&&!FC.again.has(w)){FC.again.add(w);FC.q.push(w)}
  $(".fc-fb",box).innerHTML=`<div class="row" style="justify-content:center">${wordFb(w)}</div>${FC.hint&&j===x.p.idx?'<p class="heard">Em đã nghe gợi ý nên thẻ này hẹn ôn lại ngày mai.</p>':""}${!ok?`<p class="heard">Thẻ này sẽ quay lại cuối lượt.</p>`:""}<div class="row" style="justify-content:center"><button class="btn pri" data-fc="next">Tiếp →</button></div>`;
  stopSpeak();speak(x.p.word);updateBadge();
}

    const ok=it.acc.some(a=>normT(a)===normT(v));const caseBad=ok&&it.cs&&!it.acc.includes(v.replace(/[.]$/,""));
    $("input",qi).classList.add(ok&&!caseBad?"ok":"no");
    answer(qi,ok&&!caseBad,`${caseBad?"Đúng chữ nhưng phải viết hoa chữ cái đầu. ":""}Đáp án: <b>${esc(it.acc[0])}</b>. ${it.fb||""}`);return}
  if(t.dataset.cs!==undefined){const qi=t.closest("[data-it]");if(qi.dataset.done)return;const st=PR[qi.closest("[data-pr]").dataset.pr];const it=st.items[+qi.dataset.it];const p=P(it.w);const j=+t.dataset.cs;
    const bs=$$(".syl",qi);bs[p.idx].classList.add("right");if(j!==p.idx)bs[j].classList.add("wrong");answer(qi,j===p.idx,wordFb(p.word));stopSpeak();speak(p.word);return}
  if(t.dataset.fcs!==undefined){fcAnswer(+t.dataset.fcs);return}
  if(t.dataset.fc){const k=t.dataset.fc;if(k==="hint"){FC.hint=true;stopSpeak();speak(FC.q[FC.i]);return}
    if(k==="next"){FC.i++;FC.hint=false;$("#fc").innerHTML=fcCard();return}
    if(k==="new"){$("#fc").innerHTML=fcStart();return}}
  if(t.dataset.oddlv){S.cdlv=+t.dataset.oddlv;save();$$("[data-oddlv]").forEach(b=>b.classList.toggle("on",b===t));$("#oddBox").innerHTML=practice(oddStress(S.cdlv,10),"trong-am");return}
  if(t.dataset.tlv){const id=location.hash.split("/")[1];S.cdl=S.cdl||{};S.cdl[id]=t.dataset.tlv;save();$$("[data-tlv]").forEach(b=>b.classList.toggle("on",b===t));reTopic();return}
  if(t.dataset.cdre){const k=t.dataset.cdre;
    if(k==="topic")reTopic();
    else if(k==="khac")$("#oddBox").innerHTML=practice(oddStress(S.cdlv||1,10),"trong-am");
    else if(k==="nhip")$("#nhipBox").innerHTML=practice(nhipItems(10),"trong-am");
    else if(k==="teen")$("#teenBox").innerHTML=practice(teenItems(8),"trong-am");
    else if(k==="moi")$("#moiBox").innerHTML=practice(moiItems(10),"trong-am");
    else if(k==="nhom"){const gid=location.hash.split("/")[3]||SG[0].id;const ws=SWL.filter(x=>x.g===gid);$("#nhomBox").innerHTML=practice(sylItems(pick(ws,Math.min(10,ws.length)),""),"trong-am")}
    return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".pr input")){const b=$("[data-ty]",e.target.closest("[data-it]"));if(b)b.click()}});
try{window.__CD={CDT,genRound,oddStress,nhipItems,teenItems,moiItems,SWL,SG}}catch(e){}

/* ---------- router ---------- */
function render(){
  stopSpeak();QZ={};
  let h=(location.hash||"#home").slice(1);
  let m=h.match(/^u(\d+)(?:-(.+))?$/);let html,cur=h;
  if(m&&UNITS[+m[1]-1]){const tab=TABS.some(t=>t[0]===m[2])?m[2]:"so-do";cur="u"+m[1];html=viewUnit(UNITS[+m[1]-1],tab)}
  else if(REVIEWS.some(r=>r.id===h)){html=viewReview(REVIEWS.find(r=>r.id===h))}
  else if(h==="cd"){cur="cd";html=viewCD()}
  else if(/^cd\/trong-am/.test(h)){cur="cd/trong-am";const tb=h.split("/")[2];html=viewStress(STABS.some(t=>t[0]===tb)?tb:"meo")}
  else if(/^cd\//.test(h)&&CDI[h.split("/")[1]]){cur="cd/"+h.split("/")[1];html=viewTopic(CDI[h.split("/")[1]])}
  else if(/^on(\/|$)/.test(h)){cur="on";html=viewToday(h.split("/")[1])}
  else {cur="home";html=viewHome()}
  $("#main").innerHTML=html;rail(cur);$("#rail").classList.remove("open");updateBadge();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-w]");if(!t)return;
  if(t.dataset.say!==undefined){stopSpeak();speak(t.dataset.say,{rate:t.dataset.rate});return}
  if(t.dataset.w){stopSpeak();speak(t.dataset.w);return}
  if(t.dataset.stop){stopSpeak();return}
  if(t.dataset.sayall){const u=UNITS[+t.dataset.sayall.slice(1)-1];stopSpeak();for(const v of u.vocab){await speak(v[0]);await new Promise(r=>setTimeout(r,450))}return}
  if(t.dataset.dialog){playDialogue(UNITS[+t.dataset.dialog.slice(1)-1].listen.lines);return}
  if(t.classList.contains("opt")){$$(".opt",t.parentNode).forEach(o=>o.classList.remove("sel","right","wrong"));t.classList.add("sel");return}
  if(t.dataset.check){checkQuiz(t.dataset.check);return}
  if(t.dataset.regen){const u=curUnit();const box=$(`[data-gen="${t.dataset.regen}"]`);box.innerHTML=t.dataset.regen==="odd"?quiz(oddItems(PHON[u.n].pool,4),"u"+u.n+"-na2"):t.dataset.regen==="vocab"?quiz(vocabQuiz(u),"u"+u.n+"-tv"):quiz(fillItems(u,6),"u"+u.n+"-mc");return}
  if(t.dataset.newtest){const r=REVIEWS.find(x=>x.id===t.dataset.newtest);$("#rtest").innerHTML=reviewTest(r);return}
  if(t.dataset.done){const k=t.dataset.done;S.done[k]=!S.done[k];save();t.classList.toggle("is",!!S.done[k]);t.textContent=S.done[k]?"✓ Đã học xong":"Đánh dấu đã học";rail(k);return}
  if(t.dataset.kbcheck){const k=t.closest(".kb");const v=$("input",k).value.trim();if(!v){$(".kbout",k).innerHTML='<span class="heard">Ô còn trống. Chạm micro trên bàn phím rồi đọc câu nhé.</span>';return}showScore($(".kbout",k),k.dataset.kbt,[v],k.dataset.key);return}
  if(t.dataset.recSay){const card=t.closest(".sp");doRecognize(t,t.dataset.recSay,$(".out",card),t.dataset.key);return}
  if(t.dataset.record){toggleRecord(t,$(".aud",t.closest(".sp")));return}
  if(t.dataset.answer){const card=t.closest(".sp"),out=$(".out",card);const old=t.innerHTML;t.classList.add("live");t.innerHTML=IC.mic+"Đang nghe…";
    try{const alts=await recognize();const a=alts[0];const full=toks(a).length>=3;out.innerHTML=`<div class="heard">Máy nghe được: “${esc(a)}”</div><div>${full?"Tốt, em đã trả lời bằng câu đầy đủ.":"Em thử trả lời bằng câu đầy đủ hơn, theo gợi ý."}</div>`}
    catch(err){out.innerHTML=`<span class="heard">${esc(SR_MSG[err]||SR_MSG["no-speech"])}</span>`}
    t.classList.remove("live");t.innerHTML=old;return}
  if(t.dataset.mark!==undefined){const box=t.parentNode;const was=t.classList.contains("mark");$$(".syl",box).forEach(b=>b.classList.remove("mark","right","wrong"));if(!was)t.classList.add("mark");$(".fb2",box).innerHTML="";return}
  if(t.dataset.markcheck){const sec=t.closest(".sec");const rows=$$("[data-markans]",sec);let r=0;
    rows.forEach(q=>{const ans=+q.dataset.markans;const b=$$(".syl",q);const m=b.findIndex(x=>x.classList.contains("mark"));b.forEach(x=>x.classList.remove("right","wrong"));
      if(m===ans){r++;b[m].classList.add("right")}else{if(m>=0)b[m].classList.add("wrong");b[ans].classList.add("right","mark")}
      $(".fb2",q).innerHTML=sayBtn(q.dataset.w)});
    $(".qres",t.parentNode).innerHTML=`<span class="score ${r===rows.length?"good":r>=rows.length/2?"mid":"low"}">${r}/${rows.length}</span> Ô xanh là âm tiết đúng. Bấm loa để nghe lại.`;return}
  if(t.dataset.col!==undefined){$$(".opt",t.parentNode).forEach(o=>o.classList.remove("sel","right","wrong"));t.classList.add("sel");return}
  if(t.dataset.colcheck){const box=t.closest("[data-colbox]");const k=+box.dataset.colbox;const rows=$$("[data-colans]",box);let r=0;const groups=[[],[],[]];
    rows.forEach(q=>{const ans=+q.dataset.colans;const sel=$(".opt.sel",q);$$(".opt",q).forEach(o=>o.classList.remove("right","wrong"));$$(".opt",q)[ans].classList.add("right");if(sel&&+sel.dataset.col===ans)r++;else if(sel)sel.classList.add("wrong");groups[ans].push(q.dataset.word)});
    const cols=$(".cols",box);cols.hidden=false;cols.innerHTML=groups.slice(0,k).map((g,i)=>`<div><h4>${LAB[i]}</h4>${g.map(esc).join(", ")||"–"}</div>`).join("");
    $(".qres",t.parentNode).innerHTML=`<span class="score ${r===rows.length?"good":r>=rows.length/2?"mid":"low"}">${r}/${rows.length}</span>`;return}
  if(t.classList.contains("w")&&t.closest(".sm")){$$(".w",t.parentNode).forEach(x=>x.classList.remove("right","wrong","miss"));t.classList.toggle("on");$(".out",t.closest(".qi")).innerHTML="";return}
  if(t.dataset.smcheck){const q=t.closest("[data-sm]");let hit=0,need=0,bad=0;
    $$(".w",q).forEach(x=>{x.classList.remove("right","wrong","miss");const st=x.dataset.st==="1",on=x.classList.contains("on");
      if(st){need++;if(on){hit++;x.classList.add("right")}else x.classList.add("miss")}else if(on&&x.dataset.fn==="1"){bad++;x.classList.add("wrong")}});
    const ok=hit===need&&!bad;$(".out",q).innerHTML=ok?`<span class="score good">Đúng rồi!</span>`:`<span class="score ${hit>=need-1&&bad<=1?"mid":"low"}">${hit}/${need}</span> <span class="heard">Ô viền nét đứt là từ cần nhấn mà em bỏ sót. Ô đỏ là từ nhỏ, không nhấn.</span>`;return}
  if(t.dataset.syl!==undefined){const qi=t.closest("[data-sylans]");if(qi.dataset.done)return;const ok=+t.dataset.syl===+qi.dataset.sylans;
    $$(".syl",qi)[+qi.dataset.sylans].classList.add("right");if(!ok)t.classList.add("wrong");qi.dataset.done=1;return}
  if(t.dataset.pick){$$(".opt",t.parentNode).forEach(o=>o.classList.remove("sel","right","wrong"));t.classList.add("sel");return}
  if(t.dataset.sortcheck){const sec=t.closest(".sec");const rows=$$("[data-sort]",sec);let r=0;
    rows.forEach(q=>{const sel=$(".opt.sel",q);$$(".opt",q).forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.pick===q.dataset.sort)o.classList.add("right")});if(sel&&sel.dataset.pick===q.dataset.sort)r++;else if(sel)sel.classList.add("wrong")});
    $(".qres",t.parentNode).innerHTML=`<span class="score ${r===rows.length?"good":r>=rows.length/2?"mid":"low"}">${r}/${rows.length}</span>`;return}
  if(t.dataset.gcheck){const qi=t.closest("[data-acc]");const acc=JSON.parse(qi.dataset.acc);const v=$("input",qi).value;const out=$(".out",qi);
    if(!v.trim()){out.innerHTML='<span class="heard">Em gõ câu trả lời trước nhé.</span>';return}
    const ok=acc.some(a=>norm(a)===norm(v));
    out.innerHTML=ok?`<span class="score good">Đúng rồi!</span> ${sayBtn(acc[0])}`:`<span class="score low">Chưa đúng.</span> <span class="heard">Đáp án: ${esc(acc[0])}</span>`;return}
  if(t.dataset.hint){$(".out",t.closest(".qi")).innerHTML=`<span class="heard">Gợi ý: ${esc(t.dataset.hint)}</span>`;return}
  if(t.dataset.showex){const qi=t.closest("[data-ex]");$(".out",qi).innerHTML=`<span class="heard">Ví dụ: ${esc(qi.dataset.ex)}</span> ${sayBtn(qi.dataset.ex)}`;return}
  if(t.dataset.fcheck){const qi=t.closest("[data-free]");const v=$("input",qi).value.trim();const out=$(".out",qi);
    if(!v){out.innerHTML='<span class="heard">Em viết câu trước nhé.</span>';return}
    const tips=[];const ok=new RegExp(qi.dataset.free,"i").test(v.replace(/[’‘]/g,"'"));
    if(!ok)tips.push("Câu chưa dùng đúng cấu trúc của đề.");
    if(!/^[A-Z]/.test(v))tips.push("Viết hoa chữ cái đầu câu.");
    if(!/[.!?]$/.test(v))tips.push("Thêm dấu câu ở cuối.");
    if(/(^|\s)i(\s|'|$)/.test(v))tips.push("Chữ I (tôi) phải viết hoa.");
    out.innerHTML=tips.length?`<span class="score mid">Gần đúng.</span> <span class="heard">${tips.join(" ")}</span>`:`<span class="score good">Tốt lắm!</span> <span class="heard">Câu đúng cấu trúc. Nhờ bố mẹ đọc lại xem ý có hợp không.</span>`;return}
  if(t.dataset.dictcheck){const qi=t.closest("[data-dict]");const target=qi.dataset.dict;const val=$("input",qi).value;const m=matchWords(target,val);const pct=Math.round(m.score*100);
    $(".out",qi).innerHTML=`<span class="score ${pct===100?"good":pct>=60?"mid":"low"}">${pct}%</span> <span class="res">${m.words.map((w,i)=>`<span class="w ${m.ok[i]?"ok":"no"}">${esc(w)}</span>`).join("")}</span>`;return}
  if(t.classList.contains("chip")){const ro=t.closest(".ro");const line=$(".line",ro),pool=$(".pool",ro);(t.parentNode===pool?line:pool).appendChild(t);$(".rmsg",ro).textContent="";return}
  if(t.dataset.ro){const ro=t.closest(".ro");const line=$(".line",ro),pool=$(".pool",ro);
    if(t.dataset.ro==="reset"){$$(".chip",line).forEach(c=>pool.appendChild(c));$(".rmsg",ro).textContent="";return}
    const got=$$(".chip",line).map(c=>c.textContent).join(" ");const ok=got===ro.dataset.ans;
    $(".rmsg",ro).innerHTML=ok?`<span class="score good">Đúng rồi!</span> ${sayBtn(ro.dataset.ans)}`:($(".chip",pool)?`<span class="heard">Em chưa dùng hết các từ.</span>`:`<span class="score low">Chưa đúng.</span> <span class="heard">Đáp án: ${esc(ro.dataset.ans)}</span>`);return}
});
document.addEventListener("change",e=>{const f=e.target.closest("[data-recfile]");if(!f||!f.files[0])return;const a=document.createElement("audio");a.controls=true;a.src=URL.createObjectURL(f.files[0]);a.style.cssText="max-width:100%;height:36px;display:block;margin-top:6px";f.after(a)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest(".kb")){$("[data-kbcheck]",e.target.closest(".kb")).click()}});
document.addEventListener("input",e=>{
  const ta=e.target.closest("[data-write]");if(!ta)return;
  const k=ta.dataset.write;S.drafts[k]=ta.value;save();
  const u=UNITS[+k.slice(1)-1];$("#wc-"+k).innerHTML=writeChecker(u,ta.value);
});
function curUnit(){const m=(location.hash||"").match(/^#u(\d+)/);return UNITS[(m?+m[1]:1)-1]}
$("#rateSel").value=S.rate;$("#rateSel").addEventListener("change",e=>{S.rate=e.target.value;save()});
$("#voiceSel").addEventListener("change",e=>{S.voice=e.target.value;save();speak("Hello! Let's learn English.")});
$("#menuBtn").addEventListener("click",()=>$("#rail").classList.toggle("open"));
if(TTS){loadVoices();TTS.onvoiceschanged=loadVoices}
render();
})();
